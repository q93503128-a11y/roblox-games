name: Roblox Godbase Check

on:
  push:
    paths:
      - "knowledge/**"
      - "tools/godbase/**"
      - ".github/workflows/godbase-check.yml"
  pull_request:
    paths:
      - "knowledge/**"
      - "tools/godbase/**"
      - ".github/workflows/godbase-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Godbase
        run: python tools/godbase/validate.py
