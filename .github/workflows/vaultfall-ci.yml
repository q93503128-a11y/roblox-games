name: Vaultfall CI

on:
  push:
    branches: [main]
    paths:
      - "projects/vaultfall/**"
      - ".github/workflows/vaultfall-ci.yml"
      - "rokit.toml"
  pull_request:
    paths:
      - "projects/vaultfall/**"
      - ".github/workflows/vaultfall-ci.yml"
      - "rokit.toml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit and pinned tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.1.0

      - name: Show tool versions
        run: |
          rojo --version
          selene --version

      - name: Capture Selene diagnostics
        working-directory: projects/vaultfall
        run: selene src tools > selene-report.txt 2>&1 || true

      - name: Upload Selene diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vaultfall-selene-report
          path: projects/vaultfall/selene-report.txt
          if-no-files-found: error

      - name: Lint Vaultfall Luau
        working-directory: projects/vaultfall
        run: selene src tools

      - name: Build Vaultfall place
        run: rojo build projects/vaultfall/default.project.json --output Vaultfall.rbxlx

      - name: Verify build artifact
        run: test -s Vaultfall.rbxlx

      - name: Upload test place
        uses: actions/upload-artifact@v4
        with:
          name: vaultfall-rbxlx
          path: Vaultfall.rbxlx
          if-no-files-found: error
